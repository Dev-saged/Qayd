# يبني APK قيد مع كل رفع:
# - Artifact في صفحة التشغيل، وتحديث إصدار "latest-build" التجريبي.
# - كل VERSION_NAME في gradle.properties يصير إصداراً مستقلاً vX.Y.Z بملاحظات docs/releases/vX.Y.Z.md.
# التوقيع: أسرار KEYSTORE_BASE64 و SIGNING_STORE_PASSWORD و SIGNING_KEY_ALIAS و SIGNING_KEY_PASSWORD.
# بدونها يُوقَّع بمفتاح مؤقت (يثبت، لكن التحديث فوقه يحتاج حذف النسخة السابقة).
name: Build Qayd APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/qayd-release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/qayd-release.jks" >> "$GITHUB_ENV"

      - name: Tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: |
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Qayd-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/*.apk "dist/Qayd-latest.apk"
          cp app/build/outputs/apk/release/*.apk "dist/Qayd-v${VERSION}.apk"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set — APK signed with a temporary key."
          fi
          ls -l dist

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Qayd-screens-${{ github.run_number }}
          path: app/build/snapshots/*.png
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qayd-APK-${{ github.run_number }}
          path: dist/Qayd-v*-build*.apk
          if-no-files-found: error

      - name: Update "latest-build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: قيد — آخر نسخة تجريبية
          body: آخر APK تم بناؤه تلقائياً من الفرع ${{ github.ref_name }} (build ${{ github.run_number }}).
          prerelease: true
          files: dist/Qayd-latest.apk

      - name: Publish version release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          TAG="v$VERSION"
          NOTES="docs/releases/$TAG.md"
          if [ ! -f "$NOTES" ]; then echo "## قيد $VERSION" > /tmp/notes.md; NOTES=/tmp/notes.md; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/Qayd-$TAG.apk" --clobber
            gh release edit "$TAG" --title "قيد $VERSION" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" "dist/Qayd-$TAG.apk" --title "قيد $VERSION" --notes-file "$NOTES" --target "$(git rev-parse HEAD)" --latest
          fi

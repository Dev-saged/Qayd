# يبني APK قيد مع كل رفع:
# - كل فرع: Artifact في صفحة التشغيل.
# - main: كل بناء يُنشر Release مستقلاً vX.Y.Z-bN، ملاحظاته من docs/releases/vX.Y.Z.md
#   (الإضافات / المميزات / الإصلاحات) + قائمة تغييرات هذا البناء منذ الإصدار السابق.
# التوقيع: أسرار KEYSTORE_BASE64... إن وُجدت، وإلا secrets/signing داخل المستودع الخاص.
# بدون أي منهما يُوقَّع بمفتاح مؤقت ولا يُنشر Release.
name: Build Qayd APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/qayd-release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/qayd-release.jks" >> "$GITHUB_ENV"

      - name: Detect signing
        id: sign
        run: |
          if [ -n "$KEYSTORE_BASE64" ] || [ -f secrets/signing/keystore.properties ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: |
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Qayd-v${VERSION}-b${GITHUB_RUN_NUMBER}.apk"
          if [ "${{ steps.sign.outputs.signed }}" != "true" ]; then
            echo "::warning::No signing key — APK signed with a temporary key; no Release is published."
          fi
          ls -l dist

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Qayd-screens-${{ github.run_number }}
          path: app/build/snapshots/*.png
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qayd-APK-${{ github.run_number }}
          path: dist/Qayd-v*-b*.apk
          if-no-files-found: error

      - name: Publish build release
        # لا Release بمفتاح مؤقت: لن يُثبَّت فوق النسخ الموقّعة
        if: github.ref_name == 'main' && steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}-b${GITHUB_RUN_NUMBER}"
          PREV=$(git tag --list 'v*' --sort=-creatordate | grep -v "^$TAG$" | head -n1)
          {
            echo "# قيد $VERSION — بناء $GITHUB_RUN_NUMBER"
            echo
            if [ -f "docs/releases/v$VERSION.md" ]; then cat "docs/releases/v$VERSION.md"; echo; fi
            echo "## تغييرات هذا البناء"
            if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
            git log --no-merges --pretty='- %s' $RANGE
          } > /tmp/notes.md
          cat /tmp/notes.md
          gh release delete latest-build --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "dist/Qayd-$TAG.apk" \
            --title "قيد $VERSION — بناء $GITHUB_RUN_NUMBER" \
            --notes-file /tmp/notes.md --target "$(git rev-parse HEAD)" --latest

      - name: Publish in-app update
        if: github.ref_name == 'main' && steps.sign.outputs.signed == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -a; . secrets/backend.env; set +a
          if [ -n "$CF_TOKEN" ]; then export CLOUDFLARE_API_TOKEN="$CF_TOKEN"; fi
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          BASE=$(grep '^VERSION_CODE=' gradle.properties | cut -d= -f2)
          CODE=$((BASE + GITHUB_RUN_NUMBER))
          NOTES=$(python3 -c "import json,sys; print(json.dumps(open(sys.argv[1]).read() if __import__('os').path.exists(sys.argv[1]) else ''))" "docs/releases/v$VERSION.md")
          echo "{\"version\":\"$VERSION\",\"build\":$GITHUB_RUN_NUMBER,\"code\":$CODE,\"notes\":$NOTES}" > /tmp/meta.json
          cd backend/worker
          npx -y wrangler@4 kv key put apk --binding=QAYD_APP --path="$GITHUB_WORKSPACE/dist/Qayd-v${VERSION}-b${GITHUB_RUN_NUMBER}.apk" --remote
          npx -y wrangler@4 kv key put meta --binding=QAYD_APP --path=/tmp/meta.json --remote

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; img-src data:">
<title>دفتر — الشاشة الرئيسية: ثلاثة اتجاهات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300..800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Lalezar&family=Readex+Pro:wght@300..700&display=swap" rel="stylesheet">
<style>
/* ============ CONFIG (tokens) ============ */
:root{
  --space:8px;
  --ease:cubic-bezier(.22,1,.36,1);
}
.a{ /* الاتجاه أ: دفتر حسابات داكن، ذهبي */
  --bg:light-dark(oklch(97% .012 85),oklch(16% .014 262));
  --surface:light-dark(oklch(100% 0 0),oklch(21.5% .016 262));
  --surface2:light-dark(oklch(95% .014 85),oklch(26% .018 262));
  --ink:light-dark(oklch(22% .02 262),oklch(95% .01 85));
  --mute:light-dark(oklch(46% .02 262),oklch(73% .02 262));
  --line:light-dark(oklch(89% .014 85),oklch(31% .016 262));
  --pri:light-dark(oklch(54% .13 78),oklch(81% .14 85));
  --on-pri:oklch(20% .04 80);
  --danger:light-dark(oklch(50% .2 25),oklch(73% .17 25));
  --ok:light-dark(oklch(48% .13 155),oklch(77% .15 155));
  --warn:light-dark(oklch(52% .14 60),oklch(82% .15 75));
  font-family:"Readex Pro",sans-serif;
}
.b{ /* الاتجاه ب: ورق نظيف، زمردي ومرجاني */
  --bg:light-dark(oklch(97.6% .008 195),oklch(17% .016 200));
  --surface:light-dark(oklch(100% 0 0),oklch(22% .02 200));
  --surface2:light-dark(oklch(94.5% .016 195),oklch(27% .024 200));
  --ink:light-dark(oklch(24% .03 205),oklch(95% .01 195));
  --mute:light-dark(oklch(47% .03 205),oklch(73% .025 200));
  --line:light-dark(oklch(90% .014 195),oklch(32% .022 200));
  --pri:light-dark(oklch(46% .09 195),oklch(79% .11 190));
  --on-pri:light-dark(oklch(98% .01 195),oklch(20% .04 195));
  --accent:light-dark(oklch(62% .19 35),oklch(74% .16 40));
  --danger:light-dark(oklch(50% .2 25),oklch(73% .17 25));
  --ok:light-dark(oklch(47% .12 160),oklch(77% .14 160));
  --warn:light-dark(oklch(54% .15 55),oklch(82% .15 75));
  font-family:"IBM Plex Sans Arabic",sans-serif;
}
.c{ /* الاتجاه ج: كونسول ألعاب، ليموني وسماوي */
  --bg:light-dark(oklch(96% .012 200),oklch(14.5% .022 215));
  --surface:light-dark(oklch(99% .005 200),oklch(20% .03 215));
  --surface2:light-dark(oklch(92% .02 200),oklch(25% .036 215));
  --ink:light-dark(oklch(21% .035 215),oklch(96% .01 200));
  --mute:light-dark(oklch(45% .035 215),oklch(74% .03 210));
  --line:light-dark(oklch(87% .02 205),oklch(32% .035 215));
  --pri:light-dark(oklch(50% .16 135),oklch(88% .2 125));
  --on-pri:light-dark(oklch(98% .02 130),oklch(18% .05 130));
  --accent:light-dark(oklch(52% .12 225),oklch(81% .12 215));
  --danger:light-dark(oklch(50% .2 25),oklch(72% .18 25));
  --ok:light-dark(oklch(48% .14 150),oklch(80% .17 150));
  --warn:light-dark(oklch(54% .15 60),oklch(84% .16 80));
  font-family:"Alexandria",sans-serif;
}

/* ============ صفحة العرض ============ */
*{box-sizing:border-box;margin:0}
body{background:#0d0f14;color:#e9e6df;font-family:"IBM Plex Sans Arabic",sans-serif;min-height:100dvh;padding:24px 16px 56px}
.stage-head{max-width:1280px;margin:0 auto 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.stage-head h1{font-size:clamp(1.25rem,1rem + 1.2vw,1.75rem);font-weight:600}
.stage-head p{color:#9aa0ac;font-size:.9rem;margin-block-start:4px}
.toggle{min-height:44px;padding-inline:20px;border-radius:22px;border:1px solid #394050;background:#171b24;color:inherit;font:inherit;cursor:pointer;transition:background .2s}
.toggle:hover{background:#202634}
.toggle:focus-visible{outline:2px solid #e8c36a;outline-offset:3px}
.lineup{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,390px),1fr));gap:32px;justify-items:center}
figure{width:min(100%,390px)}
figcaption{margin-block-start:14px;font-size:.92rem;color:#b9bec9;line-height:1.7}
figcaption b{display:block;color:#f2efe8;font-size:1.05rem;margin-block-end:2px}

/* ============ هيكل الهاتف المشترك ============ */
.phone{
  color-scheme:dark;position:relative;overflow:hidden;
  width:100%;aspect-ratio:390/844;border-radius:38px;
  background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;
  box-shadow:0 0 0 1px #2a3040,0 30px 60px -20px #000;
  isolation:isolate;
}
.phone[data-mode="light"]{color-scheme:light}
.phone svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.phone .num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.status{height:32px;display:flex;justify-content:space-between;align-items:center;padding-inline:26px;font-size:12px;color:var(--mute);flex:none}
.phone main{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px 18px;background:var(--surface);border-top:1px solid var(--line)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font-size:11px;color:var(--mute);text-decoration:none;border-radius:14px;transition:color .2s,background .2s}
.nav a:hover{background:var(--surface2)}
.nav a:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.nav a[aria-current]{color:var(--pri)}
.ring{width:56px;height:56px;flex:none}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .trk{stroke:var(--line)}
.ring .prg{stroke:var(--pri);transform:rotate(-90deg);transform-origin:50% 50%;stroke-dasharray:169.6}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes drift{0%{transform:translate3d(-6%,-4%,0) scale(1)}100%{transform:translate3d(6%,5%,0) scale(1.15)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.phone button,.phone a{-webkit-tap-highlight-color:transparent}

/* ============ الاتجاه أ ============ */
.a .amb{position:absolute;inset:-20%;z-index:-1;background:radial-gradient(40% 30% at 80% 8%,color-mix(in oklch,var(--pri) 22%,transparent),transparent 70%),radial-gradient(35% 28% at 10% 60%,color-mix(in oklch,var(--ok) 10%,transparent),transparent 70%);animation:drift 14s var(--ease) infinite alternate}
.a .top{display:flex;align-items:center;gap:12px;padding:6px 20px 12px}
.a .av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--pri),color-mix(in oklch,var(--pri) 55%,black));color:var(--on-pri);font-weight:700;font-size:18px}
.a .who{flex:1;min-width:0}
.a .who b{display:block;font-size:16px;font-weight:600}
.a .who span{font-size:12px;color:var(--mute)}
.a .ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);position:relative;cursor:pointer;transition:transform .2s var(--ease)}
.a .ib:active{transform:scale(.92)}
.a .ib:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.a .ib i{position:absolute;top:10px;inset-inline-end:11px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--surface)}
.a main{padding:0 20px;gap:14px}
.a .hero{padding:18px 18px 12px;border-radius:24px;background:linear-gradient(160deg,var(--surface),var(--surface2));border:1px solid var(--line);position:relative;overflow:hidden}
.a .hero::before{content:"";position:absolute;inset-inline:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--pri),transparent)}
.a .hero .row{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:13px}
.a .hero .eye{background:none;border:0;color:var(--mute);width:44px;height:44px;margin:-10px;display:grid;place-items:center;cursor:pointer;border-radius:12px}
.a .hero .eye:focus-visible{outline:2px solid var(--pri)}
.a .big{font-size:clamp(34px,10vw,42px);font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-block:6px 2px;display:flex;align-items:baseline;gap:8px}
.a .big small{font-size:18px;color:var(--pri);font-weight:500}
.a .sub{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ok)}
.a .spark{width:100%;height:46px;margin-block-start:8px}
.a .spark path{fill:none;stroke:var(--pri);stroke-width:2;stroke-linecap:round}
.a .spark .fill{fill:color-mix(in oklch,var(--pri) 16%,transparent);stroke:none}
.a .sec{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--mute);margin-block-end:-4px}
.a .sec b{color:var(--ink);font-weight:600;font-size:14.5px}
.a .ps3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.a .ps{border-radius:20px;padding:12px 8px 10px;min-height:112px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;position:relative;cursor:pointer;transition:transform .25s var(--ease),border-color .2s}
.a .ps:hover{border-color:var(--pri)}
.a .ps:active{transform:scale(.96)}
.a .ps .n{position:absolute;inset-block-start:8px;inset-inline-start:10px;font-size:11px;color:var(--mute)}
.a .ps .ring{width:46px;height:46px;margin-block-start:4px}
.a .ps b{font-size:15px;font-weight:600}
.a .ps small{font-size:11px;color:var(--mute)}
.a .ps.warn{border-color:color-mix(in oklch,var(--warn) 60%,transparent)}
.a .ps.warn .prg{stroke:var(--warn)}
.a .ps.warn small{color:var(--warn);animation:breathe 1.6s ease-in-out infinite}
.a .ps.free{color:var(--mute)}
.a .ps.free .i{width:30px;height:30px;margin-block:8px 4px}
.a .ps.free b{color:var(--ink)}
.a .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.a .mini div{padding:11px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;gap:2px}
.a .mini b{font-size:19px;color:var(--ink);font-weight:600}
.a .mini .live b{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ok)}
.a .mini .live b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);animation:breathe 2s infinite}
.a .rec{display:flex;flex-direction:column}
.a .rec li{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.a .rec .dot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);flex:none}
.a .rec .dot.d{color:var(--danger)}
.a .rec .dot.p{color:var(--ok)}
.a .rec .dot .i{width:18px;height:18px}
.a .rec .t{flex:1;min-width:0;font-size:14px}
.a .rec .t span{display:block;font-size:11.5px;color:var(--mute)}
.a .rec .v{font-size:14.5px;font-weight:600}
.a .rec .v.d{color:var(--danger)}
.a .rec .v.p{color:var(--ok)}
.a .fab{position:absolute;left:50%;translate:-50% 0;bottom:46px;width:60px;height:60px;border-radius:20px;border:0;background:linear-gradient(145deg,var(--pri),color-mix(in oklch,var(--pri) 60%,black));color:var(--on-pri);display:grid;place-items:center;box-shadow:0 12px 24px -8px color-mix(in oklch,var(--pri) 70%,transparent);cursor:pointer;transition:transform .25s var(--ease)}
.a .fab:active{transform:scale(.92) rotate(90deg)}
.a .fab:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.a .fab .i{width:26px;height:26px;stroke-width:2.2}
.a .nav a.gap{pointer-events:none}

/* ============ الاتجاه ب ============ */
.b .top{padding:6px 20px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.b .top h2{font-size:23px;font-weight:700;line-height:1.25}
.b .top p{font-size:12.5px;color:var(--mute);margin-block-start:2px}
.b .ib{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);cursor:pointer;transition:transform .2s var(--ease)}
.b .ib:active{transform:scale(.92)}
.b .ib:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.b main{padding:0 16px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto 1fr;gap:10px;align-content:start}
.b .card{background:var(--surface);border-radius:26px;padding:16px;box-shadow:0 1px 0 var(--line),0 12px 24px -16px color-mix(in oklch,var(--ink) 22%,transparent);border:1px solid var(--line)}
.b .debt{grid-column:1/-1;background:var(--pri);color:var(--on-pri);border:0;position:relative;overflow:hidden;padding:20px}
.b .debt::after{content:"";position:absolute;inset-inline-start:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:color-mix(in oklch,var(--on-pri) 12%,transparent)}
.b .debt .l{font-size:13px;opacity:.85;display:flex;justify-content:space-between;align-items:center}
.b .debt .l button{background:none;border:0;color:inherit;width:44px;height:44px;margin:-12px;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.b .debt .l button:focus-visible{outline:2px solid currentColor}
.b .debt .v{font-size:40px;font-weight:700;margin-block:6px 12px;letter-spacing:-.02em;line-height:1}
.b .debt .v small{font-size:19px;font-weight:500;margin-inline-start:6px;opacity:.85}
.b .chips{display:flex;gap:8px;position:relative;z-index:1}
.b .chip{padding:7px 12px;border-radius:14px;background:color-mix(in oklch,var(--on-pri) 14%,transparent);font-size:12.5px;display:flex;gap:6px;align-items:center}
.b .chip b{font-weight:700}
.b .ps3{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.b .ps{border-radius:22px;padding:12px 10px;min-height:106px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .25s var(--ease)}
.b .ps:active{transform:scale(.96)}
.b .ps .h{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--mute)}
.b .ps .pill{padding:3px 8px;border-radius:10px;font-size:10.5px;font-weight:600;background:color-mix(in oklch,var(--ok) 18%,transparent);color:var(--ok)}
.b .ps .pill.w{background:color-mix(in oklch,var(--accent) 20%,transparent);color:var(--accent)}
.b .ps .pill.f{background:var(--surface2);color:var(--mute)}
.b .ps .t{font-size:19px;font-weight:700;line-height:1}
.b .ps .bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.b .ps .bar i{display:block;height:100%;border-radius:3px;background:var(--ok)}
.b .ps.warn{border-color:color-mix(in oklch,var(--accent) 55%,transparent);background:color-mix(in oklch,var(--accent) 7%,var(--surface))}
.b .ps.warn .bar i{background:var(--accent)}
.b .ps.warn .t{color:var(--accent)}
.b .ps.free .t{font-size:14px;font-weight:600;color:var(--mute)}
.b .tile{display:flex;flex-direction:column;gap:6px;min-height:92px;justify-content:space-between}
.b .tile .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--pri)}
.b .tile b{font-size:21px;font-weight:700;line-height:1}
.b .tile span{font-size:12px;color:var(--mute)}
.b .tile.live .ic{color:var(--ok)}
.b .last{grid-column:1/-1;padding:6px 16px}
.b .last li{list-style:none;display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.b .last li:last-child{border:0}
.b .last .t{flex:1;min-width:0}
.b .last .t span{display:block;font-size:11.5px;color:var(--mute)}
.b .last .v{font-weight:700}
.b .last .d{color:var(--danger)}
.b .last .p{color:var(--ok)}
.b .nav{margin:0 12px 12px;border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:0 14px 28px -16px #000}
.b .nav a[aria-current]{background:var(--pri);color:var(--on-pri)}

/* ============ الاتجاه ج ============ */
.c .amb{position:absolute;inset:-10%;z-index:-1;background:conic-gradient(from 210deg at 85% 5%,transparent 0 70%,color-mix(in oklch,var(--pri) 22%,transparent) 85%,transparent 100%),radial-gradient(50% 30% at 20% 70%,color-mix(in oklch,var(--accent) 12%,transparent),transparent 70%);animation:drift 16s var(--ease) infinite alternate}
.c .top{display:flex;align-items:center;gap:10px;padding:4px 18px 10px}
.c .top h2{flex:1;font-family:"Lalezar",sans-serif;font-weight:400;font-size:27px;line-height:1.1;letter-spacing:.01em}
.c .gw{display:flex;align-items:center;gap:7px;padding:0 12px;min-height:44px;border-radius:22px;border:1px solid color-mix(in oklch,var(--ok) 45%,transparent);color:var(--ok);font-size:12px;background:color-mix(in oklch,var(--ok) 9%,transparent);cursor:pointer}
.c .gw:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.c .gw .i{width:18px;height:18px}
.c main{padding:0 18px;gap:12px}
.c .ps3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.c .ps{position:relative;border-radius:18px;padding:12px 6px 12px;min-height:158px;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s}
.c .ps:active{transform:scale(.95)}
.c .ps:focus-visible{outline:2px solid var(--pri)}
.c .ps .n{font-family:"Lalezar",sans-serif;font-size:22px;line-height:1;color:var(--mute)}
.c .ps .ring{width:74px;height:74px}
.c .ps .ring circle{stroke-width:5}
.c .ps .tm{position:absolute;inset-inline:0;top:62px;font-size:14px;font-weight:600}
.c .ps small{font-size:11px;color:var(--mute)}
.c .ps.run{box-shadow:0 0 0 1px color-mix(in oklch,var(--pri) 55%,transparent),0 0 26px -6px color-mix(in oklch,var(--pri) 55%,transparent)}
.c .ps.warn{box-shadow:0 0 0 1px color-mix(in oklch,var(--warn) 70%,transparent),0 0 26px -6px color-mix(in oklch,var(--warn) 70%,transparent)}
.c .ps.warn .prg{stroke:var(--warn)}
.c .ps.warn small{color:var(--warn);animation:breathe 1.5s ease-in-out infinite}
.c .ps.free .ring .trk{stroke-dasharray:4 7}
.c .ps.free .tm{color:var(--mute);font-weight:500;font-size:12px}
.c .btnrow{display:flex;gap:6px}
.c .sq{width:44px;height:30px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center}
.c .sq .i{width:16px;height:16px}
.c .strip{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.c .box{padding:14px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.c .box span{font-size:12px;color:var(--mute);display:block}
.c .box b{font-family:"Lalezar",sans-serif;font-weight:400;font-size:32px;line-height:1.15;display:flex;align-items:baseline;gap:6px}
.c .box b small{font-family:"Alexandria",sans-serif;font-size:14px;color:var(--pri);font-weight:500}
.c .box.pri{background:var(--pri);color:var(--on-pri);border:0}
.c .box.pri span{color:inherit;opacity:.78}
.c .box.pri b small{color:inherit}
.c .modules{display:flex;gap:8px}
.c .mod{flex:1;min-height:60px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:10px;padding-inline:12px;font-size:12.5px;cursor:pointer;transition:border-color .2s}
.c .mod:hover{border-color:var(--accent)}
.c .mod:focus-visible{outline:2px solid var(--accent)}
